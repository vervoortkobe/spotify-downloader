name: spotterfy_app
description: "Spotterfy - Download & stream playlists from Spotify, YouTube, SoundCloud"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: 6.2.1
  provider: ^6.1.5
  http: ^1.3.0
  audioplayers: any
  path_provider: ^2.1.5
  cached_network_image: ^4.0.0
  shared_preferences: ^2.5.0
  share_plus: ^13.1.0
  flutter_svg: ^2.3.0
  flutter_local_notifications: ^22.0.1
  connectivity_plus: ^6.0.3
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  permission_handler: 11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo/spotterfy_black_bg.png"
  adaptive_icon_background: "#090b0b"
  adaptive_icon_foreground: "logo/spotterfy_black_bg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - logo/spotterfy_black_bg.png
    - assets/icon.svg
