name: spotifull_app
description: "Spotifull - Download & stream playlists from Spotify, YouTube, SoundCloud"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: ^6.0.0
  provider: ^6.1.5
  http: ^1.3.0
  audioplayers: any
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  flutter_secure_storage: any
  share_plus: ^13.1.0
  flutter_svg: ^2.3.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
