services:
  backend:
    build:
      context: ./backend
    container_name: spotify-downloader-backend
    ports:
      - "5000:5000"
    environment:
      - FRONTEND_URL
      - SPOTTERFY_API_KEY
      - RATE_LIMIT_DISABLE
      - DISCOVER_REFRESH_DISABLE
      - FIREBASE_SERVICE_ACCOUNT_JSON
      - WARP_SVC_LOG_LEVEL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: spotify-downloader-frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SPOTTERFY_API_KEY: ${SPOTTERFY_API_KEY}
    restart: unless-stopped
