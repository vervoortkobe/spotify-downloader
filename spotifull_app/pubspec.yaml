name: spotifull_app
description: "Spotifull - Download & stream playlists from Spotify, YouTube, SoundCloud"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.3.1
  provider: ^6.1.5
  http: ^1.3.0
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
